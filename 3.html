<!DOCTYPE html>
<html>
<head>
<style>
/* unvisited link */
a:link {
  color: yellow;
  text-decoration: underline;
}

/* visited link */
a:visited {
  color: gray;
  text-decoration: underline;
}

/* mouse over link */
a:hover {
  color: red;
}

/* selected link */
a:active {
  color: yellow;
  background-color: yellow;
  text-decoration: underline;
} 
</style>
</head>
<body>

<p>Mouse over and click the link: <a href="https://www.w3schools.com">w3schools.com</a></p>

</body>
</html>
